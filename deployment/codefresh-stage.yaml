version: '1.0'
stages:
- prepare
- build
- deploy
- qa
- publish
steps:
  main_clone:
    title: Clone main repository
    type: git-clone
    stage: prepare
    repo: ${{CF_REPO_OWNER}}/${{CF_REPO_NAME}}
    revision: ${{CF_BRANCH}}
    git: github
  post_main_clone:
    title: Post main clone
    type: parallel
    stage: prepare
    steps:
      clone_cloud_harness:
        title: Cloning cloud-harness repository...
        type: git-clone
        stage: prepare
        repo: https://github.com/MetaCell/cloud-harness.git
        revision: ${{CLOUDHARNESS_BRANCH}}
        working_directory: .
        git: github
  prepare_deployment:
    title: Prepare helm chart
    image: python:3.12
    stage: prepare
    working_directory: .
    commands:
    - bash cloud-harness/install.sh
    - export HELM_NAME_ARG="$( [ -n "${{CHART_NAME}}" ] && printf -- "--name %s"
      "${{CHART_NAME}}" )"
    - export HELM_CHART_VERSION_ARG="$( [ -n "${{CHART_VERSION}}" ] && printf --
      "--chart-version %s" "${{CHART_VERSION}}" )"
    - export HELM_APP_VERSION_ARG="$( APP_VERSION_RESOLVED="${{APP_VERSION}}"; [
      -z "$APP_VERSION_RESOLVED" ] && 
      APP_VERSION_RESOLVED="${{DEPLOYMENT_TAG}}"; [ -n "$APP_VERSION_RESOLVED" ]
      && printf -- "--app-version %s" "$APP_VERSION_RESOLVED" )"
    - export HELM_META_ARGS="$HELM_NAME_ARG $HELM_CHART_VERSION_ARG 
      $HELM_APP_VERSION_ARG"
    - harness-deployment cloud-harness . -t ${{DEPLOYMENT_TAG}} -d ${{DOMAIN}} 
      -r ${{REGISTRY}} -rsn ${{REGISTRY_SECRET}} -n ${{NAMESPACE}} -e stage 
      --no-cd $HELM_META_ARGS -i portal
  prepare_deployment_view:
    commands:
    - helm template ./deployment/helm --debug -n ${{NAMESPACE}}
    environment:
    - ACTION=auth
    - KUBE_CONTEXT=${{NAMESPACE}}
    image: codefresh/cfstep-helm:3.6.2
    stage: prepare
    title: View helm chart
  deployment:
    stage: deploy
    type: helm
    working_directory: ./${{CF_REPO_NAME}}
    title: Installing chart
    arguments:
      helm_version: 3.6.2
      chart_name: deployment/helm
      release_name: ${{NAMESPACE}}
      kube_context: ${{CLUSTER_NAME}}
      namespace: ${{NAMESPACE}}
      chart_version: ${{DEPLOYMENT_TAG}}
      cmd_ps: --wait --timeout 600s --create-namespace
      custom_value_files:
      - ./deployment/helm/values.yaml
      custom_values:
      - 'apps_portal_harness_secrets_scicrunch-api-key="${{SCICRUNCH-API-KEY}}"'
  wait_deployment:
    stage: qa
    title: Wait deployment to be ready
    image: codefresh/kubectl
    commands:
    - kubectl config use-context ${{CLUSTER_NAME}}
    - kubectl config set-context --current --namespace=${{NAMESPACE}}
    - kubectl rollout status deployment/accounts-api
    - kubectl rollout status deployment/accounts
    - kubectl rollout status deployment/events-gk
    - kubectl rollout status deployment/argo-gk
    - kubectl rollout status deployment/portal
    - kubectl rollout status deployment/www-gk
    - sleep 60
  tests_e2e:
    stage: qa
    title: End to end tests
    working_directory: /home/test
    image: ${{REGISTRY}}/cloud-harness/test-e2e:latest
    fail_fast: false
    commands:
    - yarn test
    scale:
      portal_e2e_test:
        title: portal e2e test
        volumes:
        - ${{CF_REPO_NAME}}/applications/portal/test/e2e:/home/test/__tests__/portal
        environment:
        - APP_URL=https://www.${{DOMAIN}}
        - SKIP_SMOKETEST=true
    when:
      condition:
        all:
          whenVarExists: includes("${{SKIP_TESTS}}", "{{SKIP_TESTS}}") == true
  manual_tests:
    type: pending-approval
    stage: publish
    title: Manual tests performed
    description: Manual tests have been performed and reported
    timeout:
      duration: 168
      finalState: approved
  approval:
    type: pending-approval
    stage: publish
    title: Approve release
    description: Approve release and tagging/publication
    timeout:
      duration: 168
      finalState: approved
  publish:
    type: parallel
    stage: publish
    steps:
      publish_accounts:
        stage: publish
        type: push
        title: Accounts
        candidate: ${{REGISTRY}}/areg/accounts:${{DEPLOYMENT_TAG}}
        tags:
        - ${{DEPLOYMENT_PUBLISH_TAG}}
        - latest
        registry: ${{REGISTRY_PUBLISH_URL}}
        when:
          condition:
            all:
              skipPublish: includes('${{ACCOUNTS_PUBLISH_SKIP}}', 
                '{{ACCOUNTS_PUBLISH_SKIP}}') == true
      publish_accounts-api:
        stage: publish
        type: push
        title: Accounts api
        candidate: ${{REGISTRY}}/areg/accounts-api:${{DEPLOYMENT_TAG}}
        tags:
        - ${{DEPLOYMENT_PUBLISH_TAG}}
        - latest
        registry: ${{REGISTRY_PUBLISH_URL}}
        when:
          condition:
            all:
              skipPublish: includes('${{ACCOUNTS_API_PUBLISH_SKIP}}', 
                '{{ACCOUNTS_API_PUBLISH_SKIP}}') == true
      publish_cloudharness-base:
        stage: publish
        type: push
        title: Cloudharness base
        candidate: ${{REGISTRY}}/areg/cloudharness-base:${{DEPLOYMENT_TAG}}
        tags:
        - ${{DEPLOYMENT_PUBLISH_TAG}}
        - latest
        registry: ${{REGISTRY_PUBLISH_URL}}
        when:
          condition:
            all:
              skipPublish: includes('${{CLOUDHARNESS_BASE_PUBLISH_SKIP}}', 
                '{{CLOUDHARNESS_BASE_PUBLISH_SKIP}}') == true
      publish_cloudharness-django:
        stage: publish
        type: push
        title: Cloudharness django
        candidate: ${{REGISTRY}}/areg/cloudharness-django:${{DEPLOYMENT_TAG}}
        tags:
        - ${{DEPLOYMENT_PUBLISH_TAG}}
        - latest
        registry: ${{REGISTRY_PUBLISH_URL}}
        when:
          condition:
            all:
              skipPublish: includes('${{CLOUDHARNESS_DJANGO_PUBLISH_SKIP}}', 
                '{{CLOUDHARNESS_DJANGO_PUBLISH_SKIP}}') == true
      publish_cloudharness-flask:
        stage: publish
        type: push
        title: Cloudharness flask
        candidate: ${{REGISTRY}}/areg/cloudharness-flask:${{DEPLOYMENT_TAG}}
        tags:
        - ${{DEPLOYMENT_PUBLISH_TAG}}
        - latest
        registry: ${{REGISTRY_PUBLISH_URL}}
        when:
          condition:
            all:
              skipPublish: includes('${{CLOUDHARNESS_FLASK_PUBLISH_SKIP}}', 
                '{{CLOUDHARNESS_FLASK_PUBLISH_SKIP}}') == true
      publish_portal:
        stage: publish
        type: push
        title: Portal
        candidate: ${{REGISTRY}}/areg/portal:${{DEPLOYMENT_TAG}}
        tags:
        - ${{DEPLOYMENT_PUBLISH_TAG}}
        - latest
        registry: ${{REGISTRY_PUBLISH_URL}}
        when:
          condition:
            all:
              skipPublish: includes('${{PORTAL_PUBLISH_SKIP}}', 
                '{{PORTAL_PUBLISH_SKIP}}') == true
    when:
      condition:
        all:
          whenVarExists: includes("${{DEPLOYMENT_PUBLISH_TAG}}", 
            "{{DEPLOYMENT_PUBLISH_TAG}}") == false
  git-tag:
    title: Performing git tagging
    stage: publish
    image: alpine/git:latest
    commands:
    - git tag ${{DEPLOYMENT_PUBLISH_TAG}}
    - ORIGIN=$(git remote get-url origin)
    - PROTOCOL=https://
    - REPLACEMENT=${PROTOCOL}${{REPO_TOKEN}}@
    - git remote set-url origin ${ORIGIN/$PROTOCOL/$REPLACEMENT}
    - git push origin --tags
    when:
      condition:
        all:
          whenVarExists: includes("${{DEPLOYMENT_PUBLISH_TAG}}", 
            "{{DEPLOYMENT_PUBLISH_TAG}}") == false
          whenVarExists2: includes("${{REPO_TOKEN}}", "{{REPO_TOKEN}}") == false
