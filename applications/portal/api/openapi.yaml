      type: object
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
info:
  description: Antibody Registry API
  title: SciCrunch Antibody Registry API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/antibodies:
    get:
      description: List Antibodies
      operationId: api_routers_antibody_get_antibodies
      parameters:
      - in: query
        name: page
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
      - in: query
        name: size
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size
      - in: query
        name: updated_from
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated From
      - in: query
        name: updated_to
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated To
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAntibodies'
          description: OK
      summary: Get Antibodies
      tags:
      - antibody
    post:
      description: Create a Antibody
      operationId: api_routers_antibody_create_antibody
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAntibody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Antibody'
          description: Created
      security:
      - BearerAuth: []
      summary: Create Antibody
      tags:
      - antibody
  /api/antibodies/export:
    get:
      description: Export all antibodies in csv format
      operationId: api_routers_antibody_get_antibodies_export
      parameters: []
      responses:
        '200':
          description: OK
      security:
      - BearerAuth: []
      summary: Get Antibodies Export
      tags:
      - antibody
    post:
      description: Export antibodies as CSV
      operationId: api_routers_antibody_export_antibodies_post
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response
                type: string
          description: OK
      security:
      - BearerAuth: []
      summary: Export Antibodies Post
      tags:
      - antibody
  /api/antibodies/export/admin:
    get:
      description: Export all fields of all antibodies to a CSV file - Only for admin
        users
      operationId: api_routers_antibody_get_antibodies_export_admin
      parameters:
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AntibodyStatusEnum'
          - type: 'null'
      - in: query
        name: lastedit_time
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Lastedit Time
      responses:
        '200':
          description: OK
      security:
      - BearerAuth: []
      summary: Get Antibodies Export Admin
      tags:
      - antibody
  /api/antibodies/user:
    get:
      description: List user's Antibodies
      operationId: api_routers_antibody_get_user_antibodies
      parameters:
      - in: query
        name: page
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
      - in: query
        name: size
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAntibodies'
          description: OK
      security:
      - BearerAuth: []
      summary: Get User Antibodies
      tags:
      - antibody
  /api/antibodies/user/{accession_number}:
    get:
      description: Get antibody by the accession number
      operationId: api_routers_antibody_get_by_accession
      parameters:
      - in: path
        name: accession_number
        required: true
        schema:
          title: Accession Number
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Antibody'
          description: OK
      summary: Get By Accession
      tags:
      - antibody
    put:
      description: Update a submitted Antibody
      operationId: api_routers_antibody_update_user_antibody
      parameters:
      - in: path
        name: accession_number
        required: true
        schema:
          title: Accession Number
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAntibody'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Antibody'
          description: Accepted
      security:
      - BearerAuth: []
      summary: Update User Antibody
      tags:
      - antibody
  /api/antibodies/{antibody_id}:
    get:
      description: Get a Antibody
      operationId: api_routers_antibody_get_antibody
      parameters:
      - in: path
        name: antibody_id
        required: true
        schema:
          title: Antibody Id
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Antibody'
                title: Response
                type: array
          description: OK
      summary: Get Antibody
      tags:
      - antibody
  /api/applications:
    get:
      description: Get all applications
      operationId: api_routers_search_get_applications
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  type: string
                title: Response
                type: array
          description: OK
      summary: Get Applications
      tags:
      - search
  /api/datainfo:
    get:
      description: Get data information
      operationId: api_routers_general_get_datainfo
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataInfo'
          description: OK
      summary: Get Datainfo
      tags:
      - general
  /api/fts-antibodies:
    get:
      description: Search antibodies (Full Text Search)
      operationId: api_routers_search_fts_antibodies
      parameters:
      - in: query
        name: q
        required: true
        schema:
          title: Q
          type: string
      - in: query
        name: page
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
      - in: query
        name: size
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAntibodies'
          description: OK
      summary: Fts Antibodies
      tags:
      - search
  /api/ingest:
    post:
      description: Ingest antibody's csv data into the database
      operationId: api_routers_ingest_ingest
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response
                type: object
          description: OK
      security:
      - BearerAuth: []
      summary: Ingest
      tags:
      - ingest
  /api/live:
    get:
      description: Checks if application is healthy
      operationId: api_routers_test_live
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response
                type: string
          description: OK
      summary: Live
      tags:
      - test
  /api/partners:
    get:
      description: Get the list of partners and related images
      operationId: api_routers_general_get_partners
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PartnerResponseObject'
                title: Response
                type: array
          description: OK
      summary: Get Partners
      tags:
      - general
  /api/ping:
    get:
      description: Checks if application is up
      operationId: api_routers_test_ping
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response
                type: string
          description: OK
      summary: Ping
      tags:
      - test
  /api/ready:
    get:
      description: Checks if application is ready to take requests
      operationId: api_routers_test_ready
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response
                type: string
          description: OK
      summary: Ready
      tags:
      - test
  /api/search/antibodies:
    post:
      description: Search on Antibodies with custom filters
      operationId: api_routers_search_filter_antibodies
      parameters: []
      requestBody:
        content:
