          title: Inserttime
        ix:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ix
        kitContents:
          anyOf:
          - type: string
          - type: 'null'
          title: Kitcontents
        lastEditTime:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Lastedittime
        numOfCitation:
          anyOf:
          - type: integer
          - type: 'null'
          title: Numofcitation
        productConjugate:
          anyOf:
          - type: string
          - type: 'null'
          title: Productconjugate
        productForm:
          anyOf:
          - type: string
          - type: 'null'
          title: Productform
        productIsotype:
          anyOf:
          - type: string
          - type: 'null'
          title: Productisotype
        showLink:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Showlink
        sourceOrganism:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourceorganism
        status:
          anyOf:
          - $ref: '#/components/schemas/AntibodyStatusEnum'
          - type: 'null'
        targetModification:
          anyOf:
          - type: string
          - type: 'null'
          title: Targetmodification
        targetSpecies:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Targetspecies
        targetSubregion:
          anyOf:
          - type: string
          - type: 'null'
          title: Targetsubregion
        uniprotId:
          anyOf:
          - type: string
          - type: 'null'
          title: Uniprotid
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        vendorId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Vendorid
        vendorName:
          anyOf:
          - type: string
          - type: 'null'
          title: Vendorname
        vendorUrl:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
