        abTarget:
          anyOf:
          - type: string
          - type: 'null'
          title: Abtarget
        abTargetEntrezId:
          anyOf:
          - type: string
          - type: 'null'
          title: Abtargetentrezid
        abTargetUniprotId:
          anyOf:
          - type: string
          - type: 'null'
          title: Abtargetuniprotid
        accession:
          anyOf:
          - type: integer
          - type: 'null'
          title: Accession
        applications:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Applications
        catAlt:
          anyOf:
          - type: string
          - type: 'null'
          title: Catalt
        catalogNum:
          anyOf:
          - type: string
          - type: 'null'
          title: Catalognum
        clonality:
          anyOf:
          - $ref: '#/components/schemas/ClonalityEnum'
          - type: 'null'
        cloneId:
          anyOf:
          - type: string
          - type: 'null'
          title: Cloneid
        comments:
          anyOf:
          - type: string
          - type: 'null'
          title: Comments
        commercialType:
          anyOf:
          - $ref: '#/components/schemas/CommercialTypeEnum'
          - type: 'null'
        curateTime:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Curatetime
        curatorComment:
          anyOf:
          - type: string
          - type: 'null'
          title: Curatorcomment
        definingCitation:
          anyOf:
          - type: string
          - type: 'null'
          title: Definingcitation
        discDate:
          anyOf:
          - type: string
          - type: 'null'
          title: Discdate
        epitope:
          anyOf:
          - type: string
          - type: 'null'
