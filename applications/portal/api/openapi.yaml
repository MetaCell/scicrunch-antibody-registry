      type: object
    AntibodyStatusEnum:
      enum:
      - CURATED
      - REJECTED
      - QUEUE
      - UNDER_REVIEW
      title: AntibodyStatusEnum
      type: string
    ClonalityEnum:
      enum:
      - unknown
      - cocktail
      - control
      - isotype control
      - monoclonal
      - monoclonal secondary
      - polyclonal
      - polyclonal secondary
      - oligoclonal
      - recombinant
      - recombinant monoclonal
      - recombinant monoclonal secondary
      - recombinant polyclonal
      - recombinant polyclonal secondary
      title: ClonalityEnum
      type: string
    CommercialTypeEnum:
      enum:
      - commercial
      - non-profit
      - personal
      - other
      title: CommercialTypeEnum
      type: string
    DataInfo:
      description: Information about the data in the system
      properties:
        lastupdate:
          format: date
          title: Lastupdate
          type: string
        total:
          title: Total
          type: integer
      required:
      - total
      - lastupdate
      title: DataInfo
      type: object
    FilterRequest:
      description: The search request body that allows filtering combinations over
        multiple columns
      properties:
        contains:
          anyOf:
          - items:
              $ref: '#/components/schemas/KeyValuePair'
            type: array
          - type: 'null'
          title: Contains
        endsWith:
          anyOf:
          - items:
              $ref: '#/components/schemas/KeyValuePair'
            type: array
          - type: 'null'
          title: Endswith
        equals:
          anyOf:
          - items:
              $ref: '#/components/schemas/KeyValuePair'
            type: array
          - type: 'null'
          title: Equals
        isAnyOf:
          anyOf:
          - items:
              $ref: '#/components/schemas/KeyValueArrayPair'
            type: array
          - type: 'null'
          title: Isanyof
        isEmpty:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Isempty
        isNotEmpty:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Isnotempty
        isUserScope:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Isuserscope
        operation:
          anyOf:
          - $ref: '#/components/schemas/OperationEnum'
          - type: 'null'
        page:
          anyOf:
          - type: integer
          - type: 'null'
          default: 1
          title: Page
        search:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
        size:
          anyOf:
          - type: integer
          - type: 'null'
          default: 10
          title: Size
        sortOn:
          anyOf:
          - items:
              $ref: '#/components/schemas/KeyValueSortOrderPair'
            type: array
          - type: 'null'
          title: Sorton
        startsWith:
          anyOf:
          - items:
              $ref: '#/components/schemas/KeyValuePair'
            type: array
          - type: 'null'
          title: Startswith
      title: FilterRequest
      type: object
    IngestRequest:
      description: Request body for data ingestion
      properties:
        driveLinkOrId:
          anyOf:
          - type: string
          - type: 'null'
          title: Drivelinkorid
        hot:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Hot
      title: IngestRequest
      type: object
    KeyValueArrayPair:
      description: Utility type to represent a key-value object where value is an
        array
      properties:
        key:
          title: Key
          type: string
        value:
          items:
            type: string
          title: Value
          type: array
      required:
      - key
      - value
      title: KeyValueArrayPair
      type: object
    KeyValuePair:
      description: Utility type to represent a key-value object
      properties:
        key:
          title: Key
          type: string
        value:
          title: Value
          type: string
      required:
      - key
      - value
      title: KeyValuePair
      type: object
    KeyValueSortOrderPair:
      description: Utility type to represent a key-value object with sort order
      properties:
        key:
          title: Key
          type: string
        sortorder:
          $ref: '#/components/schemas/SortOrderEnum'
      required:
      - key
      - sortorder
      title: KeyValueSortOrderPair
      type: object
    OperationEnum:
      enum:
      - and
      - or
      title: OperationEnum
      type: string
    PaginatedAntibodies:
      description: Paginated response for antibodies
      properties:
        items:
          items:
            $ref: '#/components/schemas/Antibody'
          title: Items
          type: array
        page:
          title: Page
          type: integer
        totalElements:
          title: Totalelements
          type: integer
      required:
      - page
      - totalElements
      - items
      title: PaginatedAntibodies
      type: object
    PartnerResponseObject:
      description: Response of the list of partners and related images
      properties:
        image:
          anyOf:
          - type: string
          - type: 'null'
          title: Image
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
      title: PartnerResponseObject
      type: object
    SortOrderEnum:
      enum:
      - asc
      - desc
      title: SortOrderEnum
      type: string
    UpdateAntibody:
      description: The data type associated with the PUT method of the antibody resource
      properties:
        abName:
          anyOf:
          - type: string
          - type: 'null'
          title: Abname
        abTarget:
          anyOf:
          - type: string
          - type: 'null'
          title: Abtarget
        abTargetEntrezId:
          anyOf:
          - type: string
          - type: 'null'
          title: Abtargetentrezid
        abTargetUniprotId:
          anyOf:
          - type: string
          - type: 'null'
          title: Abtargetuniprotid
        applications:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Applications
        clonality:
          anyOf:
          - $ref: '#/components/schemas/ClonalityEnum'
          - type: 'null'
        cloneId:
          anyOf:
          - type: string
          - type: 'null'
          title: Cloneid
        comments:
          anyOf:
          - type: string
          - type: 'null'
          title: Comments
        commercialType:
          anyOf:
          - $ref: '#/components/schemas/CommercialTypeEnum'
          - type: 'null'
        definingCitation:
          anyOf:
          - type: string
          - type: 'null'
          title: Definingcitation
        epitope:
          anyOf:
          - type: string
          - type: 'null'
          title: Epitope
        kitContents:
          anyOf:
          - type: string
          - type: 'null'
          title: Kitcontents
        numOfCitation:
          anyOf:
          - type: integer
          - type: 'null'
          title: Numofcitation
        productConjugate:
          anyOf:
          - type: string
          - type: 'null'
          title: Productconjugate
        productForm:
          anyOf:
          - type: string
          - type: 'null'
          title: Productform
        productIsotype:
          anyOf:
          - type: string
          - type: 'null'
          title: Productisotype
        sourceOrganism:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourceorganism
        targetSpecies:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Targetspecies
        uniprotId:
          anyOf:
          - type: string
          - type: 'null'
          title: Uniprotid
        url:
          title: Url
          type: string
      required:
      - url
      title: UpdateAntibody
      type: object
    VendorSchema:
      description: Vendor information
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
