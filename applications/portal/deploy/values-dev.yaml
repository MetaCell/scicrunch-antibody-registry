harness:

  # The e2e submission tests need an account to log in with: declaring it here
  # seeds it into the dev realm and makes harness-deployment emit USERNAME and
  # PASSWORD into the e2e step of codefresh-dev.yaml. Dev only - values-dev.yaml
  # is merged just for `harness-deployment -e dev`, so this never reaches prod.
  # The password defaults to "test" (cloudharness_utils.testing.util).
  accounts:
    users:
      - username: metacell-qa@testuser.com
        email: metacell-qa@testuser.com
        clientRoles:
          - user

  deployment:
    replicas: 1
    resources:
      requests:
        memory: 0.6Gi
        cpu: 50m
      limits:
        cpu: 2
        memory: 2Gi
  database:
    size: 20Gi
    resources:
      requests:
        memory: 200Mi
        cpu: 10m
      limits:
        memory: 4Gi

sentry:
  sample_rate: 1.0
  traces_sample_rate: 0
  traces_sample_rate_resources: 0
  traces_sample_rate_patterns:
    "/api/": 0
    "/admin/": 0

    