worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Extract bearer token from Authorization header
    map $http_authorization $bearer_token {
        default            "";
        "~^Bearer\s+(.+)$" $1;
    }

    # Nginx-issued rate-limit cookie: reuse existing value or seed from request ID
    map $cookie__areg_rl $areg_rl_value {
        ""      $request_id;
        default $cookie__areg_rl;
    }

    # Rate-limit key: bearer token when present, nginx session cookie otherwise.
    # The client address is not usable as a key: every request arrives from the
    # gatekeeper sidecar on 127.0.0.1.
    map $bearer_token $rate_limit_key {
        ""      $areg_rl_value;
        default $bearer_token;
    }

    # Which paths take part in rate limiting. Only the API is limited; /admin is
    # already restricted to the administrator role. "search" marks the POST
    # endpoints that only read data (filtered search, export) so that ordinary
    # browsing is not charged against the much smaller write budget.
    map $uri $rl_path {
        default                    "";
        "~^/api/search/"           "search";
        "~^/api/antibodies/export" "search";
        "~^/api/"                  "api";
    }

    # Zone a request belongs to; empty key = not counted in either zone
    map "$rl_path:$request_method" $rl_class {
        default       "";
        "api:GET"     "read";
        "api:HEAD"    "read";
        "api:POST"    "write";
        "api:PUT"     "write";
        "api:PATCH"   "write";
        "api:DELETE"  "write";
        "search:GET"  "read";
        "search:HEAD" "read";
        "search:POST" "read";
    }

    map $rl_class $rl_key_read {
        "read"  $rate_limit_key;
        default "";
    }

    map $rl_class $rl_key_write {
        "write" $rate_limit_key;
        default "";
    }

    # 10 MB zones — enough for ~80 k concurrent keys each
    limit_req_zone $rl_key_read  zone=api_read:10m  rate={{ .Values.apps.portal.rate_limiting.read_rate }};
    limit_req_zone $rl_key_write zone=api_write:10m rate={{ .Values.apps.portal.rate_limiting.write_rate }};

    server {
        listen 80;
        limit_req_status 429;

        root /usr/src/app;

        # Serve static files
        location / {
            root /usr/src/app/www;
            index index.html;
            try_files $uri /index.html;
        }

        location /static {
            alias /usr/src/app/static;
            try_files $uri $uri/ =404;
        }

        # Serve persistent files
        location /media {
            alias /usr/src/app/persistent;
            try_files $uri / =404;
        }

        # Reverse proxy to Django
        location ~ ^/(admin|api) {
            # API rate limiting keyed on the bearer token, falling back to an
            # nginx-issued cookie for anonymous clients. Reads (GET/HEAD plus
            # the search/export POSTs) and writes have separate budgets; /admin
            # resolves to an empty key in both zones and is not limited.
            limit_req zone=api_read  burst={{ .Values.apps.portal.rate_limiting.read_burst }} nodelay;
            limit_req zone=api_write burst={{ .Values.apps.portal.rate_limiting.write_burst }} nodelay;
            add_header Set-Cookie "_areg_rl=$areg_rl_value; Path=/; HttpOnly; SameSite=Lax; Secure" always;

            proxy_pass http://127.0.0.1:8000;
            client_max_body_size 100M;

            # 10 minute timeout for proxied requests
            proxy_connect_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            # Buffer settings for large responses
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            # Handle client disconnections gracefully
            proxy_ignore_client_abort on;
        }


    }
}