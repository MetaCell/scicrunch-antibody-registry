harness:
  subdomain: www
  secured: open
  sentry: true
  service:
    port: 8080
    auto: true
  resources:
    - name: nginx-config
      src: "nginx.conf"
      dst: "/etc/nginx/nginx.conf"
    - name: supervisord-config
      src: "supervisord.properties"
      dst: "/etc/supervisor/conf.d/supervisord.properties"
  deployment:
    auto: true
    replicas: 1
    port: 80
    resources:
      requests:
        memory: 2.5Gi
        cpu: 50m
      limits:
        cpu: 4
        memory: 2.5Gi
    extraContainers:
      run-migrations:
        auto: true
        initContainer: true
        # shareVolume mounts the allvalues configmap + secrets, which the
        # Django settings need to resolve the postgres connection
        shareVolume: true
        command:
          - python
          - manage.py
          - migrate
          - --noinput
    volume:
      name: areg-persistent-files
      mountpath: /usr/src/app/persistent
      auto: true
      size: 5Gi
      usenfs: false
  livenessProbe:
    path: /api/live
  readinessProbe:
    path: /api/ready
  envmap:
    WORKERS: 2
  dependencies:
    build:
      - cloudharness-django
    hard:
      - events
      - accounts
      - argo
    soft:
      - pgadmin
      - accounts-api
  use_services:
    - name: accounts-api
  uri_role_mapping:
    - uri: /admin/*
      roles:
        - administrator
    - uri: /api/antibodies/export
      roles: []
    - uri: /admin
      roles:
        - administrator
      require-any-role: true
    - uri: /add
      roles: []
      require-any-role: true
    - uri: /submissions
      roles: []
      require-any-role: false
    - uri: /login
      roles: []
      require-any-role: true
    - uri: /
      white-listed: true
    - uri: /metrics
      roles:
        - administrator
    - uri: /assets/*
      white-listed: true
    - uri: /static/*
      white-listed: true
    - uri: /favicon.ico
      white-listed: true
    - uri: /robots.txt
      white-listed: true

  database:
    auto: true
    type: postgres
    size: 40Gi
    image: postgres:17
    postgres:
      image: postgres:17
      initialdb: antibody_registry
      args:
        - "-c"
        - "max_connections=200"
        - "-c"
        - "shared_buffers=768MB"
        - "-c"
        - "work_mem=4MB"
        - "-c"
        - "maintenance_work_mem=128MB"
        - "-c"
        - "effective_cache_size=2GB"
    resources:
      requests:
        memory: 4Gi
        cpu: 0.5
      limits:
        cpu: 4
        memory: 4Gi
  accounts:
    roles:
      - administrator
      - manager
      - user
  test:
    e2e:
      smoketest: false
      enabled: true
  secrets:
    scicrunch-api-key:
  proxy:
    payload:
      max: 10
    timeout:
      keepalive: 99999
      read: 99999
      send: 99999
export_query: "SELECT 'AB_' || ab_id as rrid, ab_name, catalog_num, cat_alt, api_vendor.vendor as vendor_name, api_vendor.vendor || ' Cat# ' || catalog_num || ', RRID:AB_' || ab_id AS proper_citation from api_antibody LEFT JOIN api_vendor on api_vendor.id = vendor_id WHERE true"
export_all_fields_query: "WITH applications_subquery AS (SELECT ix, string_agg(api_application.name, ', ') as applications FROM api_antibody LEFT JOIN api_antibodyapplications on api_antibodyapplications.antibody_id = api_antibody.ix LEFT JOIN api_application on api_application.id = api_antibodyapplications.application_id GROUP BY ix) SELECT api_antibody.ix, 'AB_' || ab_id as rrid, ab_name, accession, api_antibody.commercial_type, uid, uid_legacy, api_antibody.owner_id, auth_user.username as owner_username, auth_user.email as owner_email, catalog_num, catalog_num_search, cat_alt, api_vendor.vendor as vendor_name, api_vendor.vendor || ' Cat# ' || catalog_num || ', RRID:AB_' || ab_id AS proper_citation, url, ab_target, ab_target_entrez_gid, uniprot_id, target_species_raw, target_subregion, target_modification, applications_subquery.applications, epitope, api_specie.name as source_organism, clonality, clone_id, product_isotype, product_conjugate, defining_citation, product_form, comments, kit_contents, feedback, curator_comment, disc_date, status, insert_time, lastedit_time, curate_time, api_antibody.show_link FROM api_antibody LEFT JOIN api_vendor on api_vendor.id = vendor_id LEFT JOIN api_specie on api_specie.id = api_antibody.source_organism_id LEFT JOIN auth_user on auth_user.id = api_antibody.owner_id LEFT JOIN applications_subquery on applications_subquery.ix = api_antibody.ix WHERE true"

sentry:
  dsn: https://57b1ca8a70634782bd6c90dd119eeab5@o4506739169951744.ingest.sentry.io/4506758817382404
  sample_rate: 1.0
  traces_sample_rate: 0.05
  traces_sample_rate_resources: 0.001
  traces_sample_rate_patterns:
    "/api/": 0.05
    "/admin/": 0.002

scicrunch:
  cronjob:
    schedule: "0 1 * * 6" # for weekend
    max_requests_per_second: 10

# nightly full recompute of the trigger-maintained antibody_search table,
# safety net against any drift (see api/migrations/0023_antibody_search_table.py)
search_reconcile:
  cronjob:
    schedule: "45 2 * * *"

# Counting search matches is what makes a search slow: an exact total means
# Postgres visits every matching row, and a term matching ~1.6M antibodies took
# 18s to count against ~3ms for the page of results itself. Both surfaces limit
# that, differently, because they need different things from the number.
search_count_limit:
  # Public search API. The count stops at `limit` and the API reports one row
  # past it, which the frontend renders as "10,000+"; the results themselves
  # stay reachable by paging. `limit` must stay in step with LIMIT_NUM_RESULTS
  # in the frontend constants, which is what decides when a total is rendered
  # as "N+" rather than verbatim. Disable to always report exact totals.
  portal:
    enabled: true
    limit: 10000
  # Django admin changelist. Here the search is restricted to `limit` rows
  # outright rather than only having its count capped, so the total, the page
  # links and the "select all N" bulk action all agree on one bounded set.
  # Curators pick a different value per search from `choices` in the changelist
  # sidebar ("Result limit"), including "No limit" for an exact, slow answer.
  admin:
    enabled: true
    limit: 1000
    choices: [100, 1000, 10000]

# Per-client API rate limits applied by nginx (see resources/nginx.conf).
# Keyed on the bearer token, or on an nginx-issued cookie when anonymous.
rate_limiting:
  read_rate: 120r/m
  read_burst: 30
  write_rate: 20r/m
  write_burst: 10
